server {
    listen 5173;
    server_name localhost;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        default_type application/json;
        alias /usr/share/nginx/html/mcp-oauth-resource.json;
    }

    location = /.well-known/oauth-authorization-server/api {
        default_type application/json;
        alias /usr/share/nginx/html/mcp-oauth-authorization.json;
    }

    location /.well-known/ {
        return 404;
    }

    # Root location
    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # Split web/api deployments: proxy API requests to the backend service.
    # The $kaneo_api_target variable is generated at container start by
    # apps/web/env.sh from KANEO_API_PROXY_TARGET (default 127.0.0.1:1337)
    # and is resolved at request time through Docker's embedded DNS, so a
    # recreated API container with a new IP address does not cause 502
    # errors. Without this block the SPA fallback below would serve
    # index.html for /api/ requests, which the client fails to parse as JSON.
    location /api/ {
        proxy_pass $kaneo_api_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     root /usr/share/nginx/html;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=2592000";
    #     access_log off;
    # }
}
