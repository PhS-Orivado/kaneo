server {
    listen 5173;
    server_name localhost ticket.ecomply.info;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    # Proxy OAuth endpoints to the API service
    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://kaneo-api:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://kaneo-api:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        return 404;
    }

    # Proxy API requests to the API service
    location /api/ {
        proxy_pass http://kaneo-api:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root location
    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     root /usr/share/nginx/html;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=2592000";
    #     access_log off;
    # }
}
