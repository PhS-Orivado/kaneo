services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1337:1337"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

#  Optional
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  # Split deployment note: the web container proxies /api/ to the api service.
  # Set KANEO_API_PROXY_TARGET=api:1337 in .env.local so browser requests to
  # the web container reach the API instead of the SPA fallback.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    depends_on:
      - api
    restart: unless-stopped

  docs:
    image: node:24.19.0-alpine
    working_dir: /app/apps/docs
    command: sh -c "npm install -g mintlify && mintlify dev --disable-openapi"
    ports:
      - "3421:3000"
    volumes:
      - ./apps/docs:/app/apps/docs
    restart: unless-stopped

volumes:
  postgres_data:
