name: Build & push selected images (manual)

# Manually triggered image build for a selectable subset of the images.
# build-images-manual.yml always builds all three images; this variant lets
# the dispatcher choose which of kaneo, web and api to build and push. Like
# the other manual workflow it builds from the dispatched ref itself, so it
# works on develop or any branch without a release tag.

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated subset of kaneo, web, api to build"
        required: false
        type: string
        default: kaneo,web,api
      tag:
        description: "Tag applied to all published images"
        required: false
        type: string
        default: dev
      latest:
        description: "Also tag the images as latest"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Target platforms for the multi-arch build"
        required: false
        type: string
        default: linux/amd64,linux/arm64

concurrency:
  group: manual-images-selected-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Validate image selection
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # The input reaches the script only through the environment, never by
      # direct interpolation, so a crafted images value cannot inject shell.
      - name: Build matrix from requested images
        id: select
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -eu
          json="$(printf '%s' "$IMAGES" | jq -R -s --arg owner "$GITHUB_REPOSITORY_OWNER" -c '
            split(",")
            | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | unique
            | (if (map(select(. != "kaneo" and . != "web" and . != "api")) | length) > 0 then
                 "images may only contain kaneo, web and api" | halt_error(1)
               elif length == 0 then
                 "no image selected" | halt_error(1)
               else
                 .
               end)
            | map({
                name: .,
                dockerfile: (if . == "kaneo" then "./Dockerfile.kaneo"
                             else "./apps/" + . + "/Dockerfile" end),
                image: ("ghcr.io/" + $owner + "/" + .)
              })
            | {include: .}')"
          printf 'matrix=%s\n' "$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: select
    timeout-minutes: 45
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: ${{ github.repository }}/${{ matrix.name }}-selected

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGE_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Prepare Sentry auth token for source-map upload
        if: matrix.name == 'web'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mkdir -p /tmp/sentry-build-secrets
          printf '%s' "$SENTRY_AUTH_TOKEN" > /tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN
          chmod 600 /tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # secret-files mounts the file contents; 'secrets:' would pass the
          # path string as the value.
          secret-files: ${{ matrix.name == 'web' && 'SENTRY_AUTH_TOKEN=/tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN' || '' }}
