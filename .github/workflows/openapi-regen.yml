name: OpenAPI regeneration

# Temporary helper for the feat/sprint-planning branch: regenerates the
# committed API reference so it matches the new sprint routes, then removes
# itself in a follow-up commit.

on:
  push:
    branches: [feat/sprint-planning]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the API reference
        run: pnpm openapi:check:fix

      - name: Commit the regenerated reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/openapi.json
          if git diff --cached --quiet; then
            echo "apps/docs/openapi.json is already up to date"
            exit 0
          fi
          git commit -m "chore(openapi): regenerate the API reference for sprint routes"
          git push
