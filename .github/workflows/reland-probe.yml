name: reland-probe

on:
  push:
    branches:
      - feat/reland-multi-repo
    paths:
      - ".github/workflows/reland-probe.yml"
      - "resolutions/**"

permissions:
  contents: write

concurrency:
  group: reland-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      landed: ${{ steps.skip.outputs.landed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve the merge source
        run: |
          sha="0d3149e38b9ca5b66b6f032dce0422cc354a3250"
          if [ -f resolutions/merge-source.txt ]; then
            sha="$(tr -d '[:space:]' < resolutions/merge-source.txt)"
          fi
          message="Merge the completed multi-repository state (RFC 0001, PRs #15-#20) onto upstream v2.41.1"
          if [ -f resolutions/merge-message.txt ]; then
            message="$(head -n 1 resolutions/merge-message.txt)"
          fi
          echo "MERGE_SHA=$sha" >> "$GITHUB_ENV"
          echo "MERGE_MESSAGE=$message" >> "$GITHUB_ENV"
      - name: Fetch the pre-reset fork state
        run: |
          set -e
          git fetch --no-tags origin backup/fork-main-before-upstream-reset
          git cat-file -t "$MERGE_SHA"
          git log --oneline -1 "$MERGE_SHA"
      - name: Already merged?
        id: skip
        run: |
          if git merge-base --is-ancestor "$MERGE_SHA" HEAD; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attempt the multi-repository merge
        if: steps.skip.outputs.landed != 'true'
        id: attempt
        run: |
          set +e
          git merge --no-ff --no-commit "$MERGE_SHA" > merge.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat merge.log
          exit 0
      - name: Apply resolutions
        if: steps.skip.outputs.landed != 'true' && steps.attempt.outputs.code != '0'
        run: |
          if [ -d resolutions/tree ]; then
            cp -a resolutions/tree/. ./
          fi
          if [ -f resolutions/resolve.sh ]; then
            bash resolutions/resolve.sh
          fi
      - name: Verify every conflict is resolved
        if: steps.skip.outputs.landed != 'true' && steps.attempt.outputs.code != '0'
        run: |
          remaining=$(git diff --name-only --diff-filter=U | wc -l)
          if [ "$remaining" -ne 0 ]; then
            git diff --name-only --diff-filter=U
            echo "Unresolved conflicts remain." >&2
            exit 1
          fi
      - name: Complete the merge
        if: steps.skip.outputs.landed != 'true'
        run: |
          rm -rf resolutions merge.log
          git add -A
          git commit -m "$MERGE_MESSAGE"
          git push origin HEAD:refs/heads/feat/reland-multi-repo

  finish:
    needs: probe
    if: always() && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reland-multi-repo
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "The merged lockfile does not match; refreshing it."
            pnpm install --no-frozen-lockfile
          fi
      - name: Validate the merged locales
        run: pnpm i18n:check
      - name: Generate the Drizzle migration
        working-directory: apps/api
        run: pnpm db:generate
      - name: Regenerate the OpenAPI export
        run: pnpm openapi:check:fix
      - name: Commit the regenerated artifacts
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to regenerate."
          else
            git commit -m "chore: regenerate the Drizzle migration and OpenAPI export for the re-land"
            git push origin HEAD:refs/heads/feat/reland-multi-repo
          fi
