name: WP8 OpenAPI regeneration (one-shot)

on:
  push:
    branches: [feat/multi-repo-wp8-docs-openapi-mcp]
    paths-ignore:
      - 'apps/docs/openapi.json'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate the OpenAPI export
        run: pnpm openapi:check:fix
      - name: Commit and push the regenerated export
        run: |
          set +e
          status="$(git status --porcelain apps/docs/openapi.json)"
          if [ -z "$status" ]; then
            echo "apps/docs/openapi.json is already up to date"
            exit 0
          fi
          echo "changes: $status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch --show-current > /tmp/branch.txt 2>&1
          echo "current branch: $(cat /tmp/branch.txt)"
          git add apps/docs/openapi.json
          git commit --no-verify -m "docs(openapi): regenerate the export for the multi-repository routes (WP8)" > /tmp/commit.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::git commit failed (exit $code): $(head -c 400 /tmp/commit.log)"
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/multi-repo-wp8-docs-openapi-mcp > /tmp/push.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::git push failed (exit $code): $(head -c 400 /tmp/push.log)"
            exit 1
          fi
          echo "regenerated export pushed"
