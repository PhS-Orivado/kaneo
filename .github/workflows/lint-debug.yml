name: lint debug

# Temporary fork-only debug branch. Runs the upstream quality gate with the
# formatter in write mode, commits every change the vite-plus tools make
# back to this branch, and broadcasts the remaining diagnostics as GitHub
# annotations (one step per log so the annotation budget is not shared).
on:
  push:
    branches: [multi-repo-lint-debug]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the formatter in write mode
        run: pnpm format > fmt.log 2>&1 || true

      - name: Capture remaining diagnostics
        run: |
          pnpm lint > lint.log 2>&1 || true
          pnpm typecheck > typecheck.log 2>&1 || true

      - name: Broadcast formatting output
        run: node .github/scripts/broadcast-log.mjs fmt.log

      - name: Broadcast lint output
        run: node .github/scripts/broadcast-log.mjs lint.log

      - name: Broadcast typecheck output
        run: node .github/scripts/broadcast-log.mjs typecheck.log

      - name: Commit applied changes
        run: |
          git config user.name "kaneo-debug-bot"
          git config user.email "action@users.noreply.github.com"
          git add -A
          git status --porcelain > git-status.txt || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit --no-verify -m "chore: apply pnpm format (debug branch)"
            git push
          fi
