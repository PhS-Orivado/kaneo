name: WP7 i18n key sync

# RFC 0001 WP7: temporary one-shot sync. The repository-binding surface keys
# are inserted into en-US (only where absent), every locale is synchronized
# with the repository's own scripts, and the result is pushed to the branch.
# Runs triggered by the GITHUB_TOKEN push do not retrigger workflows, and a
# repeat run inserts nothing and pushes nothing.
on:
  push:
    branches: [feat/multi-repo-wp7-web-frontend]
    paths-ignore: ["i18n/**"]

permissions:
  contents: write

concurrency:
  group: wp7-i18n-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert WP7 keys into en-US
        run: node .github/scripts/wp7-i18n-keys.mjs
      - name: Regenerate the locale schema
        run: node scripts/i18n/schema.mjs
      - name: Sync every locale with en-US
        run: node scripts/i18n/check.mjs --fix
      - name: Verify the sync
        run: node scripts/i18n/check.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain i18n)" ]; then
            git add i18n
            git commit -m "chore(i18n): add repository bindings keys to every locale (WP7)"
            git push
          else
            echo "Nothing to sync."
          fi
