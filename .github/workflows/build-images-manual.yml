name: Build & push images (manual)

# Manually triggered image build. Unlike docker.yml (released versions) and
# nightly.yml (nightly tag), this workflow builds from the dispatched ref
# itself, so it can be used on develop or any branch without a release tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag applied to all published images"
        required: false
        type: string
        default: dev
      latest:
        description: "Also tag the images as latest"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Target platforms for the multi-arch build"
        required: false
        type: string
        default: linux/amd64,linux/arm64

concurrency:
  group: manual-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 45
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kaneo
            dockerfile: ./Dockerfile.kaneo
            image: ghcr.io/${{ github.repository_owner }}/kaneo
          - name: web
            dockerfile: ./apps/web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/web
          - name: api
            dockerfile: ./apps/api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/api

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: ${{ github.repository }}/${{ matrix.name }}-manual

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGE_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Prepare Sentry auth token for source-map upload
        if: matrix.name == 'web'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mkdir -p /tmp/sentry-build-secrets
          printf '%s' "$SENTRY_AUTH_TOKEN" > /tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN
          chmod 600 /tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # secret-files mounts the file contents; 'secrets:' would pass the
          # path string as the value.
          secret-files: ${{ matrix.name == 'web' && 'SENTRY_AUTH_TOKEN=/tmp/sentry-build-secrets/SENTRY_AUTH_TOKEN' || '' }}
