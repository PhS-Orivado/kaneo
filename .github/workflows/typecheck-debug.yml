name: typecheck debug

# Temporary: fork-only debug branch. Runs the same lint/typecheck as the
# upstream CI and re-emits every type error as a GitHub annotation with a
# file/line so the diagnostics can be read from the public run page.
on:
  push:
    branches: [multi-repo-typecheck-debug]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and typecheck, capture output, never fail early
        run: pnpm lint > lint.log 2>&1 || true

      - name: Re-emit diagnostics as annotations
        run: |
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("lint.log", "utf8");
            const lines = log.split(/?
/);
            const structured = /([^:s]+?)((d+),(d+)): error TSd+: (.*)/;
            const seen = new Set();
            for (const line of lines) {
              if (!line.includes("error TS")) continue;
              if (seen.has(line)) continue;
              seen.add(line);
              const m = line.match(structured);
              if (m) {
                console.log("::error file=" + m[1] + ",line=" + m[2] + ",col=" + m[3] + "::" + m[4]);
              } else {
                console.log("::error::" + line.slice(0, 240));
              }
              if (seen.size >= 150) break;
            }
            console.log("TOTAL_ERROR_LINES=" + seen.size);
          '
      - name: Show lint output tail
        if: always()
        run: tail -c 4000 lint.log || true
