name: typecheck debug

# Temporary: fork-only debug branch. Runs the same lint/typecheck as upstream CI
# and re-emits every type error as a GitHub annotation with file/line location.
on:
  push:
    branches: [multi-repo-typecheck-debug]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and typecheck, capture output, never fail early
        run: pnpm lint > lint.log 2>&1 || true

      - name: Re-emit diagnostics as annotations
        run: node .github/scripts/parse-lint-log.mjs

      - name: Show lint output tail
        if: always()
        run: tail -c 4000 lint.log || true
