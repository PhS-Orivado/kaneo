name: Debug e2e smoke failures

# v7: collect the Playwright error contexts with escape-free shell syntax and
# publish an inventory of what was collected.

on:
  push:
    branches: [sprint-planning-quality-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KANEO_E2E_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-planning
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Install browser-test dependencies
        run: pnpm --dir tests/e2e install --frozen-lockfile --ignore-scripts > step-install.log 2>&1 || true

      - name: Install Chromium
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium > step-playwright.log 2>&1 || true

      - name: Build and start disposable test instance
        run: docker compose -f tests/e2e/compose.yml up --build --wait --wait-timeout 900 > step-compose.log 2>&1 || true

      - name: Run the sprint browser test
        run: pnpm --dir tests/e2e exec playwright test sprints.spec.ts > step-e2e-run.log 2>&1 || true

      - name: Collect compose logs
        if: always()
        run: docker compose -f tests/e2e/compose.yml logs --no-color > step-instance.log 2>&1 || true

      - name: Collect Playwright error contexts
        if: always()
        run: |
          mkdir -p debug-artifacts
          if [ -d .cache/e2e/results ]; then
            cp .cache/e2e/results/*/*.md debug-artifacts/ 2>/dev/null || true
            cp .cache/e2e/results/*/*.png debug-artifacts/ 2>/dev/null || true
            cp .cache/e2e/results/*/*.txt debug-artifacts/ 2>/dev/null || true
            cp .cache/e2e/results/*/*.json debug-artifacts/ 2>/dev/null || true
          fi
          {
            echo "PWD: $(pwd)"
            echo "--- debug-artifacts ---"
            ls -la debug-artifacts 2>/dev/null
            echo "--- root cache results ---"
            ls -la .cache/e2e/results 2>/dev/null || echo "no root cache"
            echo "--- tests cache results ---"
            ls -la tests/e2e/.cache/e2e/results 2>/dev/null || echo "no tests cache"
          } > context-inventory.log 2>&1 || true

      - name: Publish debug results to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          git clone --depth 1 --branch sprint-planning-quality-debug --single-branch "https://x-access-token:${GH_TOKEN}@github.com/PhS-Orivado/kaneo.git" /tmp/results-repo
          mkdir -p /tmp/results-repo/debug-results/context
          for f in step-install.log step-playwright.log step-compose.log step-e2e-run.log step-instance.log context-inventory.log; do
            cp "$f" "/tmp/results-repo/debug-results/$f" 2>/dev/null || echo "missing $f" >> /tmp/results-repo/debug-results/step-e2e-run.log
          done
          cp debug-artifacts/* /tmp/results-repo/debug-results/context/ 2>/dev/null || true
          cd /tmp/results-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debug-results
          git commit -m "chore(debug): record e2e failure log" || echo "nothing to commit"
          git push origin sprint-planning-quality-debug || echo "publish push failed"
