name: Debug e2e smoke failures

on:
  push:
    branches: [sprint-planning-quality-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KANEO_E2E_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-planning
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Install browser-test dependencies
        run: pnpm --dir tests/e2e install --frozen-lockfile --ignore-scripts > step-install.log 2>&1 || true

      - name: Install Chromium
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium > step-playwright.log 2>&1 || true

      - name: Build and start disposable test instance
        run: docker compose -f tests/e2e/compose.yml up --build --wait --wait-timeout 900 > step-compose.log 2>&1 || true

      - name: Run browser smoke tests
        run: pnpm --dir tests/e2e test > step-e2e-run.log 2>&1 || true

      - name: Collect compose logs
        if: always()
        run: docker compose -f tests/e2e/compose.yml logs --no-color > step-instance.log 2>&1 || true

      - name: Publish debug results to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          git clone --depth 1 --branch sprint-planning-quality-debug --single-branch "https://x-access-token:${GH_TOKEN}@github.com/PhS-Orivado/kaneo.git" /tmp/results-repo
          mkdir -p /tmp/results-repo/debug-results
          for f in step-install.log step-playwright.log step-compose.log step-e2e-run.log step-instance.log; do
            cp "$f" "/tmp/results-repo/debug-results/$f" 2>/dev/null || echo "missing $f" >> /tmp/results-repo/debug-results/step-e2e-run.log
          done
          cd /tmp/results-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debug-results
          git commit -m "chore(debug): record e2e failure log" || echo "nothing to commit"
          git push origin sprint-planning-quality-debug
