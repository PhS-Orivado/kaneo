name: Sync upstream 2026-11-14

on:
  push:
    branches:
      - sync/upstream-2026-11-14

permissions:
  contents: write

concurrency:
  group: sync-upstream-2026-11-14
  cancel-in-progress: false

jobs:
  apply:
    name: Apply upstream sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upstream changes
        run: python3 scripts/upstream-sync/apply-sync.py
