# Kaneo on Coolify
#
# Deploy this stack from a Git source with Coolify's "Docker Compose" build pack:
#   Public Repository -> https://github.com/usekaneo/kaneo
#   Build Pack: Docker Compose | Base Directory: / | Compose Location: compose.coolify.yml
#
# Assign a domain to the "web" service using its container port, e.g. https://kaneo.example.com:5173
# (visitors use the normal HTTPS URL; the port only tells Coolify where to route traffic).
#
# The only required environment variable is KANEO_CLIENT_URL (your public URL, without :5173).
# AUTH_SECRET and the PostgreSQL password are auto-generated via Coolify magic variables.
# Do NOT set KANEO_API_URL — it is derived from KANEO_CLIENT_URL (public URL + /api).
# Images are built from source code using the Dockerfiles in apps/api and apps/web.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:?}
      - AUTH_SECRET=${SERVICE_HEX_64_KANEO:?}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DATABASE_URL=postgresql://kaneo:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kaneo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1337/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:?}
      - NEXT_PUBLIC_APP_URL=${KANEO_CLIENT_URL:?}
      - NEXT_PUBLIC_API_URL=${KANEO_CLIENT_URL:?}/api
      - KANEO_API_PROXY_TARGET=api:1337
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
